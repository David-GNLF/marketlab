# MarketLab — vhost nginx pour marketlab.gnlfconsult.com
#
# L'outil expose un portefeuille, des positions et une API capable de MODIFIER
# ce portefeuille : l'accès est donc protégé par authentification sur la
# totalité du site, sans exception.
#
# Installation :
#   scp deploy/marketlab.nginx.conf root@serveur:/etc/nginx/sites-available/marketlab
#   ln -s /etc/nginx/sites-available/marketlab /etc/nginx/sites-enabled/marketlab
#   htpasswd -c /etc/nginx/.marketlab_htpasswd <utilisateur>
#   nginx -t && systemctl reload nginx
# Puis, une fois le DNS en place :
#   certbot --nginx -d marketlab.gnlfconsult.com

server {
    listen 80;
    listen [::]:80;
    server_name marketlab.gnlfconsult.com;

    # certbot déposera ici son jeton de validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        auth_basic off;
    }

    # Tant que HTTPS n'est pas actif, l'authentification circulerait en clair :
    # on redirige tout le reste vers HTTPS dès que le certificat existe.
    # (certbot --nginx réécrit ce bloc automatiquement.)
    location / {
        auth_basic "MarketLab";
        auth_basic_user_file /etc/nginx/.marketlab_htpasswd;

        proxy_pass http://127.0.0.1:8600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # walk-forward et Monte Carlo sont lents
    }

    # Dashboard Streamlit sous /dashboard/ (WebSocket obligatoire)
    location /dashboard/ {
        auth_basic "MarketLab";
        auth_basic_user_file /etc/nginx/.marketlab_htpasswd;

        proxy_pass http://127.0.0.1:8501/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # Streamlit sert ses ressources statiques et son WebSocket à la racine
    location /_stcore/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8501/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/marketlab.access.log;
    error_log  /var/log/nginx/marketlab.error.log;
}
