name: Résumé quotidien du matin

# Chaque matin à 7 h (heure du Bénin, UTC+1) : synthèse des verdicts sur le
# canal de notification. Les alertes flash, elles, restent horaires.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 Bénin

concurrency:
  group: resume
  cancel-in-progress: false

jobs:
  resumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Dépendances Python
        run: pip install --quiet -r requirements-ci.txt

      # réutilise le cache de cours des alertes : verdicts bien plus rapides
      - name: Cache des cours
        uses: actions/cache@v4
        with:
          path: .cache
          key: resume-${{ github.run_id }}
          restore-keys: |
            alertes-
            resume-

      - name: Calculer et envoyer le résumé
        env:
          MARKETLAB_NTFY_TOPIC: ${{ secrets.MARKETLAB_NTFY_TOPIC }}
          MARKETLAB_FRED_API_KEY: ${{ secrets.MARKETLAB_FRED_API_KEY }}
        run: python scripts/resume_quotidien.py
