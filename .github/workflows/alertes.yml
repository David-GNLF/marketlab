name: Veille des alertes

# Les alertes tournent ici, chez GitHub : le poste de travail peut rester
# éteint. L'état anti-doublon est conservé d'une exécution à l'autre via le
# cache d'Actions — sans lui, chaque passage renverrait les mêmes alertes.
#
# CHANGEMENT DE MÉCANISME (2026-07-29). On ne compte plus sur la fréquence
# des déclenchements, mais sur la DURÉE de chacun.
#
# Mesures successives : un cron horaire → 10 passages en 24 h au lieu de 24.
# Trois crons par heure → 7 passages en 15 h au lieu de 45, soit ~15 %
# d'honorés. Les exécutions planifiées gratuites de GitHub sont au
# mieux-effort, et multiplier les crons ne les rend pas plus généreuses.
#
# Désormais : UN cron par heure, mais le processus obtenu balaie pendant
# 55 minutes, toutes les 8 minutes. Un déclenchement honoré ne donne plus un
# instantané isolé, il couvre une heure entière à 8 minutes de résolution.
# Le fil du site est réhorodaté à chaque balayage, donc la preuve reste
# visible. Sans coût supplémentaire : les minutes Actions sont illimitées
# sur un dépôt public.
on:
  workflow_dispatch:
    inputs:
      duree_minutes:
        description: "Durée de la veille (minutes)"
        required: false
        default: "55"
  schedule:
    - cron: "5 * * * *"

# cancel-in-progress: false — un déclenchement qui arrive pendant une veille
# se met en file et prendra le relais à la fin, ce qui prolonge la couverture
# au lieu de l'interrompre.
concurrency:
  group: alertes
  cancel-in-progress: false

jobs:
  alerter:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # la veille dure 55 min ; marge pour l'installation
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Dépendances Python
        run: pip install --quiet -r requirements-ci.txt

      # .cache contient l'état anti-doublon ET le cache de cours. Clé par
      # run_id + restore-keys : chaque exécution repart du plus récent.
      - name: État anti-doublon et cache des cours
        uses: actions/cache@v4
        with:
          path: .cache
          key: alertes-${{ github.run_id }}
          restore-keys: alertes-

      - name: Évaluer et envoyer les alertes
        env:
          MARKETLAB_NTFY_TOPIC: ${{ secrets.MARKETLAB_NTFY_TOPIC }}
          # accès FTPS : le passage publie aussi le fil des alertes sur le site
          MARKETLAB_FTP_HOTE: ${{ secrets.MARKETLAB_FTP_HOTE }}
          MARKETLAB_FTP_UTILISATEUR: ${{ secrets.MARKETLAB_FTP_UTILISATEUR }}
          MARKETLAB_FTP_MOT_DE_PASSE: ${{ secrets.MARKETLAB_FTP_MOT_DE_PASSE }}
          MARKETLAB_FTP_DOSSIER: ${{ secrets.MARKETLAB_FTP_DOSSIER }}
          # Sans cette surcharge, la veille relirait le cache de 12 h à
          # chaque balayage et ne détecterait jamais rien de neuf. 0,23 h
          # ≈ 14 min, juste sous l'intervalle de 15 min.
          MARKETLAB_TTL_1D_H: "0.23"
        run: >
          python scripts/alertes.py --boucle
          --duree-minutes ${{ inputs.duree_minutes || '55' }}
          --intervalle-minutes 15
