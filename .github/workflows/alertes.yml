name: Alertes horaires

# Les alertes tournent ici, chez GitHub : le poste de travail peut rester
# éteint. L'état anti-doublon est conservé d'une exécution à l'autre via le
# cache d'Actions — sans lui, chaque passage renverrait les mêmes alertes.
#
# TROIS déclenchements par heure, et non un seul. Mesuré sur 24 h avec un
# unique cron horaire : 10 passages effectifs au lieu de 24, avec des écarts
# allant jusqu'à 4 h 30. Les exécutions planifiées gratuites de GitHub sont
# au mieux-effort — la moitié environ est retardée ou sautée. En programmer
# trois par heure ne garantit rien, mais ramène l'intervalle typique bien en
# deçà de l'heure. Ce n'est pas gênant s'ils passent tous : l'état
# anti-doublon empêche de renvoyer deux fois la même alerte, et le verrou de
# concurrence empêche deux passages simultanés.
on:
  workflow_dispatch:
  schedule:
    - cron: "5,20,40 * * * *"

concurrency:
  group: alertes
  cancel-in-progress: false

jobs:
  alerter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Dépendances Python
        run: pip install --quiet -r requirements-ci.txt

      # .cache contient l'état anti-doublon ET le cache de cours. Clé par
      # run_id + restore-keys : chaque exécution repart du plus récent.
      - name: État anti-doublon et cache des cours
        uses: actions/cache@v4
        with:
          path: .cache
          key: alertes-${{ github.run_id }}
          restore-keys: alertes-

      - name: Évaluer et envoyer les alertes
        env:
          MARKETLAB_NTFY_TOPIC: ${{ secrets.MARKETLAB_NTFY_TOPIC }}
          # accès FTPS : le passage publie aussi le fil des alertes sur le site
          MARKETLAB_FTP_HOTE: ${{ secrets.MARKETLAB_FTP_HOTE }}
          MARKETLAB_FTP_UTILISATEUR: ${{ secrets.MARKETLAB_FTP_UTILISATEUR }}
          MARKETLAB_FTP_MOT_DE_PASSE: ${{ secrets.MARKETLAB_FTP_MOT_DE_PASSE }}
          MARKETLAB_FTP_DOSSIER: ${{ secrets.MARKETLAB_FTP_DOSSIER }}
        run: python scripts/alertes.py
