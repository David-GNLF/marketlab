name: Publication quotidienne du site

# Le calcul tourne ici, chez GitHub — pas sur le poste de travail, qui peut
# rester éteint. Le site est ensuite poussé vers l'hébergement cPanel en FTPS.
# 22h00 UTC = 23h00 au Bénin, après la clôture de Wall Street (20h00 UTC été).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

concurrency:
  group: publication
  cancel-in-progress: false

# contents: write — le workflow committe le journal des décisions (track
# record de l'outil) après chaque publication.
permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # 36 salles de marché à calculer (verdict + stratégie)
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          # Historique COMPLET. Par défaut, actions/checkout ne prend qu'un
          # commit : l'espace DevApp affichait alors « 1 modification depuis le
          # début du projet » et un journal d'une seule ligne. Un tableau de
          # bord qui invente ses propres chiffres ne vaut rien. Le dépôt est
          # petit, le surcoût se compte en secondes.
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Dépendances Python
        run: pip install --quiet -r requirements-ci.txt

      # Les tests tournent AVANT tout le reste : mieux vaut ne rien publier
      # que publier des chiffres faux. Ils couvrent le moteur de trading,
      # l'apprentissage des pondérations et l'invariant d'équité entre les
      # implémentations Python et PHP (le runner fournit php).
      - name: Tests
        run: python -m pytest tests/ -q

      - name: Node (front)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Construire le front
        run: |
          npm ci --prefix front --no-fund --no-audit
          npm run build --prefix front

      # Le cache de cours accélère la génération et réduit la charge sur les
      # sources gratuites. Clé datée : restauré du jour précédent, resauvé
      # chaque jour.
      - name: Cache des cours
        uses: actions/cache@v4
        with:
          path: .cache
          key: cours-${{ github.run_id }}
          restore-keys: cours-

      # Volatilité réalisée des séances TERMINÉES, mesurée sur les barres
      # 5 min. Yahoo ne les sert que sur 60 jours glissants : sans ce relevé
      # quotidien conservé dans data_local, l'historique de volatilité ne
      # dépassera jamais deux mois. Une journée déjà relevée n'est pas
      # réécrite, donc le fichier ne bouge que quand une vraie séance
      # s'ajoute — pas de commit à chaque passage.
      # continue-on-error : c'est une mesure d'appoint, elle ne doit pas
      # empêcher la publication du site.
      - name: Relevé de volatilité réalisée
        continue-on-error: true
        run: python scripts/capturer_intraday.py --releve

      # Ré-arbitrage HAR-RV contre l'EWMA et la marche au hasard, hors
      # échantillon. Au 2026-07-30 avec 59 jours d'historique, HAR gagne le
      # RMSE mais PERD le QLIKE : les deux critères se contredisent, donc rien
      # n'est retenu et le cône de prévision garde son comportement actuel.
      # L'étape tourne quand même chaque jour parce que l'historique grandit
      # d'une séance par titre : le jour où l'avantage devient net sur les deux
      # critères, har_modele.json passe à « retenu » et l'intégration s'active
      # d'elle-même. Aucune décision manuelle à prendre.
      # Instantané du calendrier économique. ForexFactory ne sert QUE la
      # semaine en cours et ne publie AUCUN résultat : le résultat d'une
      # statistique ne se récupère que par la valeur « précédente » de la
      # publication suivante du même indicateur. Sans cette accumulation
      # quotidienne, l'indice de surprise ne pourra jamais exister — et il ne
      # produira rien avant un à deux cycles de publication.
      # Cette étape aussi interroge FRED : l'indice de surprise confronte le
      # consensus au chiffre RÉELLEMENT publié, qu'elle va chercher là-bas.
      - name: Instantané du calendrier économique
        continue-on-error: true
        env:
          MARKETLAB_FRED_API_KEY: ${{ secrets.MARKETLAB_FRED_API_KEY }}
        run: python -c "from marketlab import surprise; print(surprise.mettre_a_jour_calendrier())"

      # Le classement de l'outil est-il inversé dans certains régimes ? Mesuré
      # sans recouvrement (dates espacées de l'horizon + embargo), donc sans
      # l'approximation qui fragilisait le t corrigé. Là où l'inversion est
      # confirmée, l'avis directionnel est SUSPENDU — jamais retourné : l'effet
      # repose sur trop peu d'épisodes distincts pour qu'on parie dessus.
      # Tourne AVANT la génération : les verdicts du jour doivent en tenir
      # compte immédiatement.
      # PAS de continue-on-error ici, contrairement aux étapes d'appoint.
      # Deux raisons : c'est le seul mécanisme qui modifie les avis, et une
      # étape en continue-on-error ne met pas le job en échec — donc
      # « if: failure() » ne se déclenche pas et l'échec ne produit NI
      # notification, NI run rouge. Il ne resterait qu'une ligne dans un
      # journal que personne ne lit, pendant que le verdict de régime reste
      # figé sur la mesure d'un jour précédent.
      - name: Verdict par régime de marché
        run: python -c "from marketlab import regimes; v = regimes.calibrer(); print('avis suspendu dans :', v['suspendus'] or 'aucun régime')"

      - name: Arbitrage du modèle de volatilité
        continue-on-error: true
        run: python -c "from marketlab import har; r = har.calibrer(); print('HAR retenu :', r['retenu'])"

      # La clé FRED va à l'étape de GÉNÉRATION, pas à celle de publication :
      # c'est ici que macro.py et drivers.py interrogent la Réserve fédérale
      # (inflation, taux directeur, chômage, courbe, taux réels, dollar).
      # Sans clé l'API répond quand même, mais avec des quotas anonymes qu'un
      # balayage quotidien de six séries peut heurter — et une série manquée
      # dégrade le régime macro sans rien casser de visible.
      - name: Générer l'instantané
        env:
          MARKETLAB_FRED_API_KEY: ${{ secrets.MARKETLAB_FRED_API_KEY }}
        run: python scripts/publier.py --generer-seul

      # Garde-fou : toute dérive de périmètre (un univers absent du screener,
      # une fiche manquante…) fait échouer la publication AVANT l'envoi.
      - name: Vérifier la cohérence
        run: python scripts/verifier_coherence.py --site

      # Le robot lit les verdicts frais, tient TOUS les comptes de trading
      # virtuel (stops/objectifs/liquidations sur les extrêmes de séance),
      # prend ses positions selon ses règles écrites, et produit le
      # classement (concours.json) publié avec le reste du site.
      # continue-on-error : le robot touche au réseau (FTPS vers l'hébergeur)
      # et peut échouer sur un incident passager. Quand c'est arrivé, la nuit
      # du 2026-07-28, TOUTE la publication est tombée avec lui — le site
      # n'a pas été mis à jour alors que les verdicts étaient déjà calculés.
      # Un robot muet est préférable à un site figé : l'échec reste visible
      # dans Actions, et le prochain passage rattrape les comptes.
      - name: Robot de trading virtuel
        continue-on-error: true
        env:
          MARKETLAB_FTP_HOTE: ${{ secrets.MARKETLAB_FTP_HOTE }}
          MARKETLAB_FTP_UTILISATEUR: ${{ secrets.MARKETLAB_FTP_UTILISATEUR }}
          MARKETLAB_FTP_MOT_DE_PASSE: ${{ secrets.MARKETLAB_FTP_MOT_DE_PASSE }}
          MARKETLAB_FTP_DOSSIER: ${{ secrets.MARKETLAB_FTP_DOSSIER }}
          # sans ce canal, le robot continuerait d'agir en silence : c'est
          # exactement ce qu'on vient de corriger
          MARKETLAB_NTFY_TOPIC: ${{ secrets.MARKETLAB_NTFY_TOPIC }}
        run: python scripts/robot_trading.py

      - name: Publier le site
        env:
          MARKETLAB_FTP_HOTE: ${{ secrets.MARKETLAB_FTP_HOTE }}
          MARKETLAB_FTP_UTILISATEUR: ${{ secrets.MARKETLAB_FTP_UTILISATEUR }}
          MARKETLAB_FTP_MOT_DE_PASSE: ${{ secrets.MARKETLAB_FTP_MOT_DE_PASSE }}
          MARKETLAB_FTP_DOSSIER: ${{ secrets.MARKETLAB_FTP_DOSSIER }}
        run: python scripts/publier.py --publier-seul

      # Le journal des décisions est le track record de l'outil : il doit
      # survivre au runner éphémère, donc il est commité dans le dépôt.
      - name: Committer le journal des décisions
        run: |
          git config user.name "marketlab-actions"
          git config user.email "actions@users.noreply.github.com"
          # tout le suivi de data_local d'un coup : journal, pondérations et
          # portefeuille papier. En n'en nommant que deux, le troisième
          # restait modifié et « git pull --rebase » refusait de tourner.
          git add -A data_local
          if git diff --cached --quiet; then
            echo "journal inchangé"
            exit 0
          fi
          git commit -m "Journal des décisions du $(date -u +%F)"
          # artefacts régénérés hors data_local : ils ne doivent pas
          # bloquer le rebase (l'espace de travail du runner est jetable)
          git checkout -- . 2>/dev/null || true
          git fetch -q origin master
          # AVANT : « git pull --rebase origin master || true ». Le « || true »
          # avalait l'échec du rebase et laissait le dépôt EN PLEIN rebase, si
          # bien que le push suivant partait condamné (non-fast-forward) et que
          # le vrai message de conflit n'apparaissait nulle part. Constaté le
          # 2026-07-30 : deux publications se sont chevauchées (une poussée
          # manuelle et une déclenchée à la main), conflit sur
          # paper_portfolio.json et poids_appris.json, run rouge alors que le
          # site avait été publié correctement.
          if ! git rebase origin/master; then
            # Tout ce qui vit sous data_local est un artefact RECALCULÉ à
            # chaque passage : la version que ce runner vient de produire est
            # la plus fraîche, elle gagne.
            #
            # ATTENTION À L'INVERSION. Pendant un REBASE, « ours » désigne la
            # branche d'accueil (donc le distant) et « theirs » le commit qu'on
            # rejoue (donc le nôtre). C'est l'exact inverse d'un merge. Pour
            # garder la version du runner, il faut bien --theirs.
            git checkout --theirs -- data_local || true
            git add -A data_local
            if ! GIT_EDITOR=true git rebase --continue; then
              git rebase --abort || true
              echo "::error::rebase impossible : journal non commité (le site, lui, est publié)"
              exit 1
            fi
          fi
          git push origin master

      # Une génération silencieusement dégradée vaut d'être signalée : le
      # site continuerait d'afficher des chiffres de plus en plus datés.
      - name: Signaler un échec sur ntfy
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.MARKETLAB_NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -m 20 -H "Title: MarketLab publication" -H "Priority: high" \
              -d "La publication quotidienne du site a echoue : voir GitHub Actions." \
              "https://ntfy.sh/$NTFY_TOPIC" || true
          fi
